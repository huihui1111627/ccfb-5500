<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>充电桩运营后台 · 登录</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-brand">
    <div class="logo">⚡</div>
    <h1>充电桩运营后台</h1>
    <p>ChargeOps · 场站 · 订单 · 结算 · 客服一体化运营平台</p>
    <ul class="brand-points">
      <li>6 城 72 座场站实时监控</li>
      <li>订单、发票、工单统一流转</li>
      <li>多角色分级授权</li>
    </ul>
  </div>
  <div class="login-card">
    <h2>账号登录</h2>
    <p class="muted">请使用运营账号登录,车主请使用手机号后八位初始密码</p>
    <form id="login-form" autocomplete="off">
      <label>用户名
        <input id="username" name="username" placeholder="请输入用户名" required>
      </label>
      <label>密码
        <input id="password" name="password" type="password" placeholder="请输入密码" required>
      </label>
      <button type="submit" class="btn-primary" id="login-btn">登 录</button>
      <div class="login-msg" id="login-msg"></div>
    </form>
    <div class="demo-accounts">
      <div class="demo-title">演示账号</div>
      <code>admin / Admin@123</code>
      <code>operator / Operator@123</code>
      <code>finance / Finance@123</code>
      <code>support / Support@123</code>
      <code>alice / Alice@123(车主)</code>
      <code>bob / Bob@123(车主)</code>
      <code>merchant / Merchant@123(合作方)</code>
    </div>
  </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('login-msg');
  msg.textContent = '';
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      location.href = '/app';
    } else {
      msg.textContent = data.error || '登录失败';
    }
  } catch (err) {
    msg.textContent = '网络错误:' + err;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
